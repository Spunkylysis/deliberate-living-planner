name: Deploy Supabase Migrations

# Runs whenever a migration file changes on main. Requires three repo
# secrets (Settings > Secrets and variables > Actions):
#   SUPABASE_ACCESS_TOKEN  — from supabase.com/dashboard/account/tokens
#   SUPABASE_PROJECT_ID    — the project ref, e.g. abcdefghijklmnop
#   SUPABASE_DB_PASSWORD   — the database password set when the project was created

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

      - name: Push migrations
        run: supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
