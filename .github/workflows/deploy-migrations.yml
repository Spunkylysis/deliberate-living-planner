name: Deploy Supabase Migrations

# Currently DISABLED from auto-running. Every migration in this project
# has actually been applied directly (via a live Supabase connection)
# and independently verified after each one — this workflow has never
# been the thing actually deploying anything, so its automatic failure
# on every push (missing the 3 secrets below) was pure noise, not a
# real problem. Left in place, manually triggerable, in case it's ever
# worth setting up for real — e.g. if someone other than the person
# doing this manual verification starts contributing.
#
# To actually enable auto-deploy on push again: add these 3 repo
# secrets (Settings > Secrets and variables > Actions), then move
# the "on: push" block back in below workflow_dispatch:
#   SUPABASE_ACCESS_TOKEN  — from supabase.com/dashboard/account/tokens
#   SUPABASE_PROJECT_ID    — the project ref, e.g. abcdefghijklmnop
#   SUPABASE_DB_PASSWORD   — the database password set when the project was created

on:
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

      - name: Push migrations
        run: supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
